<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Avaliação de Conhecimento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; }
    iframe { width: 100%; height: 100vh; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="formulario" src="https://form.jotform.com/261605885042054"></iframe>

  <script>
    // Detecta quando a janela perde foco (funciona mesmo com iframe em foco)
    window.addEventListener("blur", function () {
      sessionStorage.setItem("saiu_aba", "true");
    });

    // Detecta troca de aba também
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        sessionStorage.setItem("saiu_aba", "true");
      }
    });

    // Ao voltar para a página, verifica se saiu
    window.addEventListener("focus", verificar);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        verificar();
      }
    });

    function verificar() {
      if (sessionStorage.getItem("saiu_aba") === "true") {
        sessionStorage.removeItem("saiu_aba");
        document.body.innerHTML = `
          <div style="
            display:flex; flex-direction:column; align-items:center;
            justify-content:center; height:100vh; font-family:sans-serif;
            background:#fff; text-align:center; padding:20px;
          ">
            <div style="font-size:60px;">🚫</div>
            <h2 style="color:#c0392b;">Avaliação Encerrada</h2>
            <p style="color:#555; max-width:400px;">
              Você saiu da página durante a avaliação.<br>
              Por questões de integridade, sua tentativa foi encerrada.<br><br>
              Entre em contato com o responsável para uma nova tentativa.
            </p>
          </div>
        `;
      }
    }

    // Força o foco voltar para a janela principal periodicamente
    // para garantir que o blur do iframe seja detectado
    setInterval(function () {
      if (document.activeElement && document.activeElement.tagName === "IFRAME") {
        // iframe está em foco, ok
      }
    }, 500);
  </script>

</body>
</html>
